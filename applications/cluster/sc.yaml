apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-classes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/90s-org/argocd.git
    targetRevision: main
    path: applications/cluster/sc
  destination:
    server: https://kubernetes.default.svc
    namespace: default    # StorageClass is cluster-scoped; namespace is required by ArgoCD but unused
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
