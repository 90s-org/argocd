apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: efs-csi-driver
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/aws-efs-csi-driver
      chart: aws-efs-csi-driver
      targetRevision: 3.x
      helm:
        valueFiles:
          - $values/applications/cluster/efs-csi-driver/values.yaml
    - repoURL: https://github.com/90s-org/argocd.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
