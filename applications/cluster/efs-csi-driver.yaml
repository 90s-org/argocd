apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: efs-csi-driver
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: aws-efs-csi-driver
    repoURL: https://kubernetes-sigs.github.io/aws-efs-csi-driver
    targetRevision: 3.x   # not pinned to an exact version yet — do that once you confirm one, same as ebs-csi-driver's 2.64.0
    helm:
      releaseName: efs-csi-driver
      # no values — chart defaults (serviceAccount.create: true, no IRSA annotation)
      # rely on the EC2 node group's own IAM instance role having EFS permissions attached
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
