apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # after namespace.yaml (-1) in this same sync. NOTE: this chart has no PVC today — mongodb runs on ephemeral storage; add a PVC referencing ebs-gp3 if data needs to survive pod restarts
spec:
  project: default
  source:
    repoURL: https://github.com/90s-org/roboshop-helm.git
    targetRevision: main
    path: mongodb            # path to the chart inside the repo
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: roboshop-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true