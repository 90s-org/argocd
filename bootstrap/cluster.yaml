apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # must be healthy before any namespace root starts
spec:
  project: default
  source:
    repoURL: https://github.com/90s-org/argocd.git
    targetRevision: main
    path: applications/cluster
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
